spring:
  application:
    name: ms-onclass-capacity
  webflux:
    base-path: /api/v1
  main:
    web-application-type: reactive
  r2dbc:
    url: ${DB_URL:r2dbc:postgresql://localhost:5432/on_class_capacity}
    username: ${DB_USERNAME:on_class_capacity}
    password: ${DB_PASSWORD}
jwt:
  secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
  issuer: ${JWT_ISSUER:http://localhost:8081}
  audience: ${JWT_AUDIENCE:on-class-technology}
services:
  technology:
    url: ${TECHNOLOGY_SERVICE_URL:http://localhost:8083/api/v1}
    timeout: ${TECHNOLOGY_SERVICE_TIMEOUT:3s}
server:
  port: ${SERVER_PORT:8082}

springdoc:
  swagger-ui:
    url: ${spring.webflux.base-path}/openapi.yaml
    path: /swagger-ui.html
  enable-default-api-docs: false
