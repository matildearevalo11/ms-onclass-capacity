---
openapi: 3.1.0
info:
  title: On-Class Capacity API
  version: 1.0.0
  description: Registro de capacidades.
servers:
- url: "/api/v1"
security:
- bearerAuth: []
paths:
  "/capacities":
    post:
      operationId: createCapacity
      summary: Registrar capacidad
      description: Registra una capacidad con entre 3 y 20 tecnologías. Requiere rol
        ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CapacityRequest"
      responses:
        '201':
          description: Capacidad registrada.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CapacityResponse"
        '400':
          description: Datos inválidos, tecnologías repetidas o inexistentes.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Autenticación requerida.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Requiere rol ADMIN.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '409':
          description: La capacidad ya tiene tecnologías asociadas.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '503':
          description: Servicio o base de datos no disponible.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '500':
          description: Error interno.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required:
      - errors
      properties:
        errors:
          type: object
          required:
          - message
          properties:
            message:
              type: string
    CapacityRequest:
      type: object
      required:
      - name
      - description
      - technologyIds
      properties:
        name:
          type: string
          minLength: 1
          description: Nombre obligatorio.
          example: Backend
        description:
          type: string
          minLength: 1
          description: Descripción obligatoria.
          example: Desarrollo de servicios
        technologyIds:
          type: array
          minItems: 3
          maxItems: 20
          uniqueItems: true
          items:
            type: integer
            format: int64
            minimum: 1
          example:
          - 1
          - 2
          - 3
          description: IDs de tecnologías existentes, sin repetidas.
    CapacityResponse:
      type: object
      required:
      - id
      - name
      - description
      - technologyIds
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        name:
          type: string
          minLength: 1
          description: Nombre obligatorio.
          example: Backend
        description:
          type: string
          minLength: 1
          description: Descripción obligatoria.
          example: Desarrollo de servicios
        technologyIds:
          type: array
          minItems: 3
          maxItems: 20
          uniqueItems: true
          items:
            type: integer
            format: int64
            minimum: 1
          example:
          - 1
          - 2
          - 3
          description: IDs de tecnologías existentes, sin repetidas.
