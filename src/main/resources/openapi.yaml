---
openapi: 3.1.0
info:
  title: On-Class Capacity API
  version: 1.0.0
  description: Registro y consulta de capacidades.
servers:
- url: "/api/v1"
security:
- bearerAuth: []
paths:
  "/capacities/details":
    get:
      operationId: capacityDetailsByIds
      summary: Consultar capacidades con tecnologías
      description: Devuelve nombre e ID de las capacidades solicitadas, con nombre e ID de sus tecnologías. Requiere rol ADMIN.
      parameters:
      - name: ids
        in: query
        required: true
        description: IDs de capacidades.
        schema:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
            minimum: 1
        style: form
        explode: false
      responses:
        '200':
          description: Capacidades encontradas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CapacityDetail'
        '400':
          description: Parámetros inválidos.
        '401':
          description: Autenticación requerida.
        '403':
          description: Requiere rol ADMIN.
        '503':
          description: Servicio de tecnologías o base de datos no disponible.
  "/capacities/ids":
    get:
      operationId: existingCapacityIds
      summary: Consultar IDs de capacidades existentes
      description: Devuelve los IDs existentes entre los solicitados. Requiere rol ADMIN.
      parameters:
      - name: ids
        in: query
        required: true
        description: IDs de capacidades por comprobar.
        schema:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
            minimum: 1
        style: form
        explode: false
      responses:
        '200':
          description: IDs existentes.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int64
        '400':
          description: Parámetros inválidos.
        '401':
          description: Autenticación requerida.
        '403':
          description: Requiere rol ADMIN.
  "/capacities":
    delete:
      operationId: deleteCapacities
      summary: Eliminar capacidades
      description: Elimina las capacidades indicadas y solicita la limpieza de sus tecnologías. Requiere rol ADMIN.
      parameters:
      - name: ids
        in: query
        required: true
        description: IDs de capacidades separados por coma.
        schema:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
            minimum: 1
        style: form
        explode: false
      responses:
        '204':
          description: Capacidades eliminadas.
        '400':
          description: Parámetros inválidos.
        '401':
          description: Autenticación requerida.
        '403':
          description: Requiere rol ADMIN.
        '503':
          description: Tecnología o base de datos no disponible.
    get:
      operationId: listCapacities
      summary: Listar capacidades
      description: Lista capacidades con sus tecnologías. Requiere rol ADMIN.
      parameters:
      - name: page
        in: query
        description: Página desde cero.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        description: Elementos por página.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - name: sortBy
        in: query
        description: Campo de orden.
        schema:
          type: string
          enum: [name, technologyCount]
          default: name
      - name: direction
        in: query
        description: Dirección de orden.
        schema:
          type: string
          enum: [asc, desc]
          default: asc
      responses:
        '200':
          description: Página de capacidades.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CapacityPage"
        '400':
          description: Parámetros inválidos.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Autenticación requerida.
        '403':
          description: Requiere rol ADMIN.
        '503':
          description: Servicio o base de datos no disponible.
    post:
      operationId: createCapacity
      summary: Registrar capacidad
      description: Registra una capacidad con entre 3 y 20 tecnologías. Requiere rol
        ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CapacityRequest"
      responses:
        '201':
          description: Capacidad registrada.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CapacityResponse"
        '400':
          description: Datos inválidos, tecnologías repetidas o inexistentes.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Autenticación requerida.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Requiere rol ADMIN.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '409':
          description: La capacidad ya tiene tecnologías asociadas.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '503':
          description: Servicio o base de datos no disponible.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '500':
          description: Error interno.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CapacityDetail:
      type: object
      required: [id, name, technologies]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        technologies:
          type: array
          items:
            $ref: '#/components/schemas/TechnologySummary'
    TechnologySummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    CapacityListItem:
      type: object
      required: [id, name, description, technologies]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        technologies:
          type: array
          items:
            "$ref": "#/components/schemas/TechnologySummary"
    CapacityPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            "$ref": "#/components/schemas/CapacityListItem"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
    ErrorResponse:
      type: object
      required:
      - errors
      properties:
        errors:
          type: object
          required:
          - message
          properties:
            message:
              type: string
    CapacityRequest:
      type: object
      required:
      - name
      - description
      - technologyIds
      properties:
        name:
          type: string
          minLength: 1
          description: Nombre obligatorio.
          example: Backend
        description:
          type: string
          minLength: 1
          description: Descripción obligatoria.
          example: Desarrollo de servicios
        technologyIds:
          type: array
          minItems: 3
          maxItems: 20
          uniqueItems: true
          items:
            type: integer
            format: int64
            minimum: 1
          example:
          - 1
          - 2
          - 3
          description: IDs de tecnologías existentes, sin repetidas.
    CapacityResponse:
      type: object
      required:
      - id
      - name
      - description
      - technologyIds
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        name:
          type: string
          minLength: 1
          description: Nombre obligatorio.
          example: Backend
        description:
          type: string
          minLength: 1
          description: Descripción obligatoria.
          example: Desarrollo de servicios
        technologyIds:
          type: array
          minItems: 3
          maxItems: 20
          uniqueItems: true
          items:
            type: integer
            format: int64
            minimum: 1
          example:
          - 1
          - 2
          - 3
          description: IDs de tecnologías existentes, sin repetidas.
